# v4 实验前数据质量检测（无模型 · 仅质检报告 · 不 gate 丢弃数据）
# 阈值按 Cyton 6 导帽 cyy_ws01_20260826 真机 3s 窗标定；Cz/CPz 配置为不用
duration_s: 90
eval_interval_s: 3.0
eval_window_s: 3.0
pass_streak_required: 5
auto_stop_on_pass: false

eeg_frame_interval_s: 0.25
save_eeg_csv: true
lsl_stream_name: OpenBCI_EEG
lsl_timeout_s: 8.0

channel_labels:
  - FC3
  - C3
  - CP3
  - CZ
  - CPZ
  - FC4
  - C4
  - CP4
fs: 250

# 仅以下 6 导参与 PASS/FAIL；Cz/CPz 卡轨为预期，不拖垮整窗
scoring_channels:
  - C3
  - C4
  - CP3
  - FC4
  - FC3
  - CP4
unused_channels:
  - CZ
  - CPZ
unused_allow_rail: true

signal_quality_enabled: true
signal_min_median_std_uv: 0.50
signal_max_median_std_uv: 8.0
# peak/ptp 为逐通道减窗均值后的 AC 量；min 关闭，靠 std/active 抓空帽
signal_min_peak_to_peak_uv: 0.0
signal_max_ptp_uv: 600.0
signal_max_peak_uv: 600.0
signal_min_per_channel_std_uv: 0.40
signal_max_per_channel_std_uv: 150.0
signal_min_active_channels: 5
signal_max_channel_std_ratio: 3.0
signal_min_car_std_uv: 0.10
signal_max_common_mode_ratio: 1.45
