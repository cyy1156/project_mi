<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
html,body{margin:0;padding:0;background:#fff;}
.card{padding:12px 16px 8px;background:#fff;}
svg{display:block;width:1200px;height:1140px;}
svg text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
</style></head><body><div class="card"><svg viewBox="0 0 1200 1140" xmlns="http://www.w3.org/2000/svg" font-size="12">
    <defs>
      <marker id="ar" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
        <path d="M0,0 L9,4 L0,8 Z" fill="#33475B"/>
      </marker>
      <marker id="arG" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
        <path d="M0,0 L9,4 L0,8 Z" fill="#8A94A0"/>
      </marker>
    </defs>
    <text x="34" y="34" font-size="18" font-weight="bold" fill="#24425F">在线系统分层架构与实时数据流（编号 ①–⑦ 对应正文实时链路）</text>

    <!-- ============ L1 客户端层 ============ -->
    <rect x="30" y="55" width="1140" height="185" rx="10" fill="#EEF3FB" stroke="#B9CCE8"/>
    <text x="48" y="80" font-size="14" font-weight="bold" fill="#33517E">客户端层（Client Layer）</text>
    <rect x="70" y="92" width="320" height="132" rx="8" fill="#FFFFFF" stroke="#7FA3D4"/>
    <text x="84" y="114" font-size="13.5" font-weight="bold" fill="#24425F">① 游戏前端（被试视角）</text>
    <text x="84" y="134" fill="#4A5A6A">Three.js 第一人称虚拟手与目标物</text>
    <text x="84" y="152" fill="#4A5A6A">Cue 阶段动觉引导语（左手/右手抓握）</text>
    <text x="84" y="170" fill="#4A5A6A">接收判定 → 手臂够取目标物反馈动画</text>
    <text x="84" y="188" fill="#4A5A6A">试次计分（想象判对 +1 / 静息判对 +0.5）</text>
    <text x="84" y="210" fill="#8A94A0">职责：刺激呈现 · 反馈渲染 · 事件上报</text>

    <rect x="435" y="92" width="320" height="132" rx="8" fill="#FFFFFF" stroke="#7FA3D4"/>
    <text x="449" y="114" font-size="13.5" font-weight="bold" fill="#24425F">② 操作台（实验员控制面）</text>
    <text x="449" y="134" fill="#4A5A6A">被试登录 / 会话号管理</text>
    <text x="449" y="152" fill="#4A5A6A">实时波形与三分类概率监测</text>
    <text x="449" y="170" fill="#4A5A6A">门控确认、暂停 / 拒绝 / 中止</text>
    <text x="449" y="188" fill="#4A5A6A">按键化控制（P/N/G/R/Esc）</text>
    <text x="449" y="210" fill="#8A94A0">职责：会话控制 · 实时监测 · 审计日志</text>

    <rect x="800" y="92" width="355" height="132" rx="8" fill="#FFFFFF" stroke="#7FA3D4"/>
    <text x="814" y="114" font-size="13.5" font-weight="bold" fill="#24425F">③ 采集硬件（OpenBCI Cyton）</text>
    <text x="814" y="134" fill="#4A5A6A">8 导运动皮层：FC3 C3 CP3 CZ CPZ FC4 C4 CP4</text>
    <text x="814" y="152" fill="#4A5A6A">采样率 250 Hz</text>
    <text x="814" y="170" fill="#4A5A6A">采集层滤波：0.5–45 Hz 带通 + 50 Hz 陷波</text>
    <text x="814" y="188" fill="#4A5A6A">支持合成板调试模式</text>
    <text x="814" y="210" fill="#8A94A0">职责：脑电信号获取（设备层）</text>

    <!-- ============ L2 通信接入层 ============ -->
    <rect x="30" y="262" width="1140" height="130" rx="10" fill="#FFF7E8" stroke="#E4CE9E"/>
    <text x="48" y="287" font-size="14" font-weight="bold" fill="#8A6D2F">通信接入层（Communication Layer）</text>
    <rect x="70" y="300" width="685" height="78" rx="8" fill="#FFFFFF" stroke="#D3B26A"/>
    <text x="84" y="322" font-size="13.5" font-weight="bold" fill="#24425F">④ WebSocket 网关（双向消息通道）</text>
    <text x="84" y="341" fill="#4A5A6A">控制面鉴权 · 消息路由 · 转义 · 心跳保活</text>
    <text x="84" y="359" fill="#4A5A6A">JSON 消息契约：范式状态 / 判定结果 / 概率流 / 控制指令</text>
    <rect x="800" y="300" width="355" height="78" rx="8" fill="#FFFFFF" stroke="#D3B26A"/>
    <text x="814" y="322" font-size="13.5" font-weight="bold" fill="#24425F">⑤ LSL 因果推流通道</text>
    <text x="814" y="341" fill="#4A5A6A">Lab Streaming Layer 因果时间戳推流</text>
    <text x="814" y="359" fill="#4A5A6A">250 Hz 高频脑电流，仅供服务端消费</text>

    <!-- ============ L3 服务层 ============ -->
    <rect x="30" y="414" width="1140" height="300" rx="10" fill="#EDF7EE" stroke="#B5D6B8"/>
    <text x="48" y="439" font-size="14" font-weight="bold" fill="#3E6B44">服务层（Server Layer）</text>
    <rect x="70" y="452" width="340" height="120" rx="8" fill="#FFFFFF" stroke="#7BBF83"/>
    <text x="84" y="472" font-size="13.5" font-weight="bold" fill="#24425F">⑥ 会话管理与范式状态机</text>
    <text x="84" y="490" fill="#4A5A6A">被试登录、会话号分配与启停控制</text>
    <text x="84" y="508" font-size="11.5" fill="#4A5A6A">OpenBMI-Align：Rest 4 s → 准备 2 s → Cue 1 s</text>
    <text x="84" y="525" font-size="11.5" fill="#4A5A6A">→ 运动想象 4 s → 间隔 3 s</text>
    <text x="84" y="543" fill="#4A5A6A">事件打标（Cue/想象起止锚点）与试次计数</text>
    <text x="84" y="562" fill="#8A94A0">职责：交互协议驱动 · 会话生命周期</text>

    <rect x="435" y="452" width="340" height="120" rx="8" fill="#FFFFFF" stroke="#7BBF83"/>
    <text x="449" y="474" font-size="13.5" font-weight="bold" fill="#24425F">⑦ 采集服务与信号质检</text>
    <text x="449" y="493" fill="#4A5A6A">Cyton / 合成板接入，环形缓冲</text>
    <text x="449" y="511" fill="#4A5A6A">健康监测：缓冲龄 / 信号质量 / 通道完整性</text>
    <text x="449" y="529" fill="#4A5A6A">断流看门狗：停滞 2 s 告警 · 5 s 中止会话</text>
    <text x="449" y="552" fill="#8A94A0">职责：信号接入 · 质量防线</text>

    <rect x="800" y="452" width="355" height="120" rx="8" fill="#FFFFFF" stroke="#7BBF83"/>
    <text x="814" y="474" font-size="13.5" font-weight="bold" fill="#24425F">⑧ 实时推理引擎（CausalFuse-8）</text>
    <text x="814" y="493" fill="#4A5A6A">CAR → 8–30 Hz 带通 → 逐窗 z-score</text>
    <text x="814" y="511" fill="#4A5A6A">3 s / 100 ms 因果滑窗 · 四成员并行前向</text>
    <text x="814" y="529" fill="#4A5A6A">温度校准 + 固定权重融合（单窗前向 1.11 ms）</text>
    <text x="814" y="552" fill="#8A94A0">职责：脑电解码 · 概率输出</text>

    <rect x="70" y="588" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#7BBF83"/>
    <text x="84" y="610" font-size="13.5" font-weight="bold" fill="#24425F">⑨ 模型管理与晋升</text>
    <text x="84" y="629" fill="#4A5A6A">按被试加载 subjects/*/models/current</text>
    <text x="84" y="647" fill="#4A5A6A">无个人模型时回退通用底座</text>
    <text x="84" y="665" fill="#4A5A6A">采后晋升 / 回滚 / 历史快照归档</text>
    <text x="84" y="685" fill="#8A94A0">职责：个体适配模型的生命周期</text>

    <rect x="435" y="588" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#7BBF83"/>
    <text x="449" y="610" font-size="13.5" font-weight="bold" fill="#24425F">⑩ 状态同步与判定分发</text>
    <text x="449" y="629" fill="#4A5A6A">100 ms 节拍：范式状态 × 滑窗判定同步</text>
    <text x="449" y="647" fill="#4A5A6A">因果平滑（回看两窗）+ 试次多数票</text>
    <text x="449" y="665" fill="#4A5A6A">判定 / 概率广播至游戏前端与操作台</text>
    <text x="449" y="685" fill="#8A94A0">职责：实时性枢纽 · 反馈触发源</text>

    <rect x="800" y="588" width="355" height="110" rx="8" fill="#FFFFFF" stroke="#7BBF83"/>
    <text x="814" y="610" font-size="13.5" font-weight="bold" fill="#24425F">⑪ 安全与审计</text>
    <text x="814" y="629" fill="#4A5A6A">控制指令鉴权与非法输入过滤</text>
    <text x="814" y="647" fill="#4A5A6A">操作审计日志 · 会话收尾崩溃安全落盘</text>
    <text x="814" y="665" fill="#4A5A6A">核心流水线回归测试覆盖</text>
    <text x="814" y="685" fill="#8A94A0">职责：安全防线 · 可追溯性</text>

    <!-- ============ L4 数据存储层 ============ -->
    <rect x="30" y="736" width="1140" height="160" rx="10" fill="#F5EFFA" stroke="#D4C3E8"/>
    <text x="48" y="761" font-size="14" font-weight="bold" fill="#5E4785">数据存储层（Data Layer · 全链路落盘，任何评测可从原始数据重放）</text>
    <rect x="70" y="775" width="340" height="105" rx="8" fill="#FFFFFF" stroke="#B49BD6"/>
    <text x="84" y="797" font-size="13.5" font-weight="bold" fill="#24425F">⑫ 会话原始数据</text>
    <text x="84" y="816" fill="#4A5A6A">eeg.csv（原始脑电）· events.jsonl（事件标签）</text>
    <text x="84" y="834" fill="#4A5A6A">manifest.json / session.meta.json（元数据）</text>
    <text x="84" y="852" fill="#4A5A6A">continuous/ 与 by_phase/ 切分产物</text>
    <rect x="435" y="775" width="340" height="105" rx="8" fill="#FFFFFF" stroke="#B49BD6"/>
    <text x="449" y="797" font-size="13.5" font-weight="bold" fill="#24425F">⑬ 模型仓库</text>
    <text x="449" y="816" fill="#4A5A6A">subjects/*/models/current（个人适配模型）</text>
    <text x="449" y="834" fill="#4A5A6A">members/ + e1f_overlay.json（融合参数）</text>
    <text x="449" y="852" fill="#4A5A6A">历史快照归档，可审计、可回滚</text>
    <rect x="800" y="775" width="355" height="105" rx="8" fill="#FFFFFF" stroke="#B49BD6"/>
    <text x="814" y="797" font-size="13.5" font-weight="bold" fill="#24425F">⑭ 配置权威与质检产物</text>
    <text x="814" y="816" fill="#4A5A6A">v3_session.yaml / ft_policy.json / protocol.yaml</text>
    <text x="814" y="834" fill="#4A5A6A">alignment/verify_report.json（对齐校验）</text>
    <text x="814" y="852" fill="#4A5A6A">force_promote_warning.json（晋升告警）</text>

    <!-- ============ 离线适配链路 ============ -->
    <rect x="30" y="918" width="1140" height="98" rx="10" fill="#FDF0EE" stroke="#E8C0B8"/>
    <text x="48" y="943" font-size="14" font-weight="bold" fill="#9C4A3C">离线适配链路（会话结束自动触发，不在实时判定路径上）</text>
    <rect x="70" y="954" width="1060" height="50" rx="8" fill="#FFFFFF" stroke="#DCA79C"/>
    <text x="84" y="975" font-size="13" font-weight="bold" fill="#24425F">⑮ Leave-Next 采后微调作业</text>
    <text x="380" y="975" fill="#4A5A6A">全成员增量微调 + 10% 源域回放 → 质量门控（保留评测窗级原始准确率）</text>
    <text x="84" y="994" fill="#4A5A6A">PASS → 晋升；FAIL → 告警落盘（默认强制晋升）；连续 FAIL → 回滚并降学习率，再 FAIL → 冻结在线更新</text>

    <!-- ============ 箭头：编号实时链路 ============ -->
    <!-- ① 操作台 -> 网关 : 控制指令 -->
    <line x1="595" y1="224" x2="595" y2="298" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="604" y="266" fill="#33475B" font-size="12">① 会话控制指令（上行）</text>
    <!-- ② 会话状态下行 会话管理->网关->游戏前端：网关->游戏前端 -->
    <line x1="230" y1="298" x2="230" y2="228" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="150" y="266" fill="#33475B" font-size="12">② 范式状态 / 计分（下行）</text>
    <!-- ③ Cyton -> LSL -> 采集服务 -->
    <line x1="977" y1="224" x2="977" y2="298" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="986" y="266" fill="#33475B" font-size="12">③ 原始脑电 250 Hz</text>
    <line x1="977" y1="378" x2="778" y2="450" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="800" y="432" fill="#33475B" font-size="12">③ LSL 因果推流</text>
    <!-- 会话管理 -> 采集服务 -->
    <line x1="410" y1="512" x2="433" y2="512" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="421" y="498" fill="#33475B" font-size="11" text-anchor="middle">启停/节拍</text>
    <!-- 采集服务 -> 推理 -->
    <line x1="775" y1="512" x2="798" y2="512" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="786" y="498" fill="#33475B" font-size="11" text-anchor="middle">④ 最新 3 s 窗</text>
    <!-- 推理 -> 状态分发 : 沿行间走廊 -->
    <path d="M 975 572 L 975 580 L 605 580 L 605 586" fill="none" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="700" y="577" fill="#33475B" font-size="12">⑤ 融合概率（100 ms 节拍）</text>
    <!-- 状态分发 -> 网关 : 沿列间走廊 x=412 -->
    <path d="M 433 643 L 412 643 L 412 380" fill="none" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="418" y="420" fill="#33475B" font-size="12">⑤ 判定 / 概率下行（推送双前端）</text>
    <!-- 会话管理/采集 -> 会话原始数据 : 左外侧走廊 -->
    <path d="M 68 512 L 46 512 L 46 828 L 68 828" fill="none" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="8" y="690" fill="#33475B" font-size="12" transform="rotate(-90 8 690)">⑥ 会话落盘（eeg / events / manifest）</text>
    <!-- 模型管理 <-> 模型仓库 -->
    <line x1="605" y1="698" x2="605" y2="773" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <line x1="590" y1="773" x2="590" y2="698" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="614" y="742" fill="#33475B" font-size="12">⑦ 加载 / 晋升</text>
    <!-- 配置权威 -> 服务层 (dashed) -->
    <line x1="977" y1="773" x2="977" y2="700" stroke="#8A94A0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arG)"/>
    <text x="985" y="742" fill="#66788A" font-size="12">配置加载（冻结口径）</text>
    <!-- 数据层 -> 适配作业 -> 模型仓库 -->
    <line x1="240" y1="880" x2="240" y2="952" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="248" y="922" fill="#33475B" font-size="12">历史场次数据</text>
    <line x1="700" y1="954" x2="700" y2="882" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="708" y="922" fill="#33475B" font-size="12">⑦ 晋升个人模型（下场会话生效）</text>

    <!-- 图例 -->
    <text x="34" y="1042" font-size="12" fill="#66788A">图例：</text>
    <rect x="76" y="1032" width="14" height="14" fill="#EEF3FB" stroke="#B9CCE8"/><text x="96" y="1044" font-size="12" fill="#66788A">客户端层</text>
    <rect x="166" y="1032" width="14" height="14" fill="#FFF7E8" stroke="#E4CE9E"/><text x="186" y="1044" font-size="12" fill="#66788A">通信接入层</text>
    <rect x="276" y="1032" width="14" height="14" fill="#EDF7EE" stroke="#B5D6B8"/><text x="296" y="1044" font-size="12" fill="#66788A">服务层</text>
    <rect x="356" y="1032" width="14" height="14" fill="#F5EFFA" stroke="#D4C3E8"/><text x="376" y="1044" font-size="12" fill="#66788A">数据存储层</text>
    <rect x="466" y="1032" width="14" height="14" fill="#FDF0EE" stroke="#E8C0B8"/><text x="486" y="1044" font-size="12" fill="#66788A">离线适配链路（非实时路径）</text>
    <line x1="646" y1="1039" x2="690" y2="1039" stroke="#33475B" stroke-width="1.6" marker-end="url(#ar)"/><text x="700" y="1044" font-size="12" fill="#66788A">实时数据流（①–⑦ 编号对应下方全链路）</text>
    <line x1="946" y1="1039" x2="990" y2="1039" stroke="#8A94A0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arG)"/><text x="1000" y="1044" font-size="12" fill="#66788A">配置/旁路</text>
    <text x="34" y="1078" font-size="12.5" fill="#4A5A6A">实时性要点：判定延迟约 3.5 s（窗口时程 3.0 s + 判定点覆盖 0.5 s），算法单窗前向仅 1.11 ms，远小于 100 ms 节拍；</text>
    <text x="34" y="1098" font-size="12.5" fill="#4A5A6A">场次质量门控、微调、落盘均在会话末触发或旁路执行，不占用实时判定路径；断流看门狗与质量门控保证异常显式化而非静默吸收。</text>
  </svg></div></body></html>
