# BCI Competition IV 2a — Cue后 0~4s 任务 / Cue前 4s 静息 → 1000@250Hz
dataset: bci2a
loader: load_bci2a_mat

data_glob: "D:/cyy/MI/DATA/bci2a/A0*T.mat"

subject_from: stem3

label_map:
  1: [1, 1]
  2: [1, 2]
drop_codes: [3, 4]
make_rest: true
rest_balance: min_left_right

# 切窗：pipeline.preprocess_run_4s
window_mode: cue0_4
win_sec: 4.0
fs_out: 250

target_chans: [Cz, C3, C4, CP3, FC4, FC3, CP4, CPz]

val_ratio: 0.2
seed: 42

out_dir: "out/bci2a_4s"
save_full: true
save_split: true
